<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIORA | Architecte de Systèmes</title>

    <meta name="description" content="J'accompagne les coachs à stabiliser leurs revenus via des systèmes simples et durables.">
    <meta property="og:title" content="Miora | Architecte de Systèmes pour Coachs">

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --bg-1: #05051a;
            --bg-2: #080826;
            --bg-3: #030312;
            --text: #ffffff;
            --accent: #00d4e8;
            --border-white: 1px solid rgba(255,255,255,0.18);
            --shadow-white: 6px 6px 0px rgba(255,255,255,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            overflow-x: hidden;
            background-color: var(--bg-1);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .label-style, .massive-title {
            font-family: 'Syne', sans-serif !important;
        }

        section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        h1, h2, h3, .label-style {
            font-family: 'Syne', sans-serif;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.02em;
        }

        h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); }

        .section-title {
            font-size: clamp(2rem, 5vw, 4rem);
            text-align: center;
            margin-bottom: 40px;
        }

        p, li, footer {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        .hero-layout {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .hero-layout > div:first-child {
            flex: 1;
            max-width: 500px;
            min-width: 320px;
        }

        .hero-layout h1 { margin-bottom: 15px !important; }
        .hero-layout p { margin-bottom: 10px !important; font-size: 1.1rem !important; }
        .hero-layout ul { margin-top: 10px !important; margin-bottom: 20px !important; }

        .hero-layout > div:last-child {
            flex: 0 0 320px;
        }

        .hero-img-thin-cyan {
            border: 3px solid var(--accent) !important;
            box-shadow: 8px 8px 0px rgba(255, 255, 255, 0.8) !important;
            filter: grayscale(1);
            width: 100% !important;
            max-width: 380px;
            margin-right: 0 !important;
            margin-left: auto;
            display: block;
            transition: 0.3s ease;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: var(--border-white);
            padding: 40px;
            box-shadow: var(--shadow-white);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0px rgba(0,212,232,0.2);
            border-color: rgba(0,212,232,0.4);
        }

        .reveal-underline {
            position: relative;
            display: inline-block;
        }

        .reveal-underline::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 0%;
            height: 4px;
            background-color: var(--accent); opacity: 0.8;
            transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
        }

        [data-aos].aos-animate .reveal-underline::after {
            width: 100% !important;
        }

        .label-style { font-size: 0.9rem; font-weight: 800; letter-spacing: 4px; }

        .pivot-row {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            max-width: 1000px;
            margin: 0 auto;
            align-items: baseline;
        }

        .offer-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 60px;
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 0 1px rgba(0,212,232,0.08), 0 30px 60px rgba(0,0,0,0.4);
            gap: 40px;
        }

        .btn-cta {
            display: inline-block;
            background: transparent;
            color: var(--accent) !important;
            padding: 14px 32px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 700;
            border: 2px solid var(--accent);
            border-radius: 999px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            font-family: 'Inter', sans-serif !important;
            font-size: 1rem;
        }

        .btn-cta:hover {
            background: var(--accent) !important;
            color: #05051a !important;
            box-shadow: 0px 0px 20px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }

        .nav-dots {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: var(--accent);
            transform: scale(1.3);
        }

        ul { list-style: none; margin-top: 25px; padding-left: 0; }
        ul li::before { content: "→ "; color: var(--accent); margin-right: 6px; }
        footer { text-align: center; padding: 30px; opacity: 0.6; background: #02020b; }

        @media (max-width: 960px) {
            .hero-layout, .pivot-row, .offer-box {
                display: flex;
                flex-direction: column;
                text-align: center;
            }
            .hero-img-thin-cyan {
                width: 100% !important;
                max-width: 320px;
                margin: 20px auto !important;
            }
            section { height: auto; padding: 60px 20px; }
        }

        @media (max-width: 768px) {
            html { scroll-snap-type: none; }
            body { scroll-snap-type: none; }
        }
    </style>
</head>
<body>

    <div class="nav-dots">
        <div class="dot active" data-section="0"></div>
        <div class="dot" data-section="1"></div>
        <div class="dot" data-section="2"></div>
    </div>

    <section id="hero">
        <div class="container hero-layout">
            <div data-aos="fade-right">
                <span class="label-style" style="color: var(--accent); display: block; margin-bottom: 20px;">Architecte de Systèmes</span>
                <h1 data-aos="fade-up" data-aos-delay="200">Stabilisez vos <span class="reveal-underline">revenus</span></h1>
                <p data-aos="fade-up" data-aos-delay="400">J'accompagne les coachs à structurer leur activité pour générer des revenus prévisibles sans s'épuiser.</p>
                <ul data-aos="fade-up" data-aos-delay="600">
                    <li>Audit de votre écosystème</li>
                    <li>Architecture de vente automatisée</li>
                    <li>Optimisation de la conversion</li>
                </ul>
                <div data-aos="fade-up" data-aos-delay="800">
                    <a href="#contact" class="btn-cta">Réserver un diagnostic</a>
                </div>
            </div>
            <div data-aos="zoom-in" data-aos-delay="300">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=380" alt="Miora" class="hero-img-thin-cyan">
            </div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        AOS.init({
            duration: 1200,
            once: true,
            offset: 100
        });

        // Gestion des dots de navigation
        const dots = document.querySelectorAll('.dot');
        const sections = document.querySelectorAll('section');

        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (pageYOffset >= (sectionTop - sectionHeight / 3)) {
                    current = section.getAttribute('id');
                }
            });

            dots.forEach(dot => {
                dot.classList.remove('active');
                if (dot.getAttribute('data-section') === current) {
                    dot.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
